server:
  servlet:
    context-path: /
proxy:
  title: "Open Analytics Shiny Proxy"
  logo-url: https://www.openanalytics.eu/shinyproxy/logo.png
  authentication: simple

  containerBackend: ecs
  realm-id: realm1
  admin-users:
    - jack

  ecs:
    name: ${ecs_cluster_name}
    region: ${ecs_region}
    subnets:
      - ${ecs_subnet_0}
      - ${ecs_subnet_1}
    security-groups: ${ecs_security_group}

  users:
    - name: jack
      password: password
      groups: mathematicians
  specs:
    - id: 01_hello
      display-name: Hello Application
      description: Application which demonstrates the basics of a Shiny app
      container-cmd: [ "R", "-e", "shinyproxy::run_01_hello()" ]
      container-image: openanalytics/shinyproxy-demo
      access-groups: [ scientists, mathematicians ]
      container-cpu-request: 1024
      container-memory-request: 2048

fqdn: ${loadbalancer_fqdn}
image: registry.openanalytics.eu/openanalytics/shinyproxy-snapshot:3.3.0-SNAPSHOT-20261013.115715
cpu-request: 512
memory-request: 1024
