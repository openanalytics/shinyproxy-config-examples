server:
  servlet:
    context-path: /

spring:
  session:
    store-type: redis
    data:
      redis:
        configure-action: none
  data:
    redis:
      ssl:
        enabled: true
      password: $${REDIS_PASSWORD}
      host: $${REDIS_HOST}
proxy:
  stop-proxies-on-shutdown: false
  store-mode: Redis
  title: "Open Analytics Shiny Proxy"
  logo-url: https://www.openanalytics.eu/shinyproxy/logo.png
  authentication: simple

  containerBackend: ecs
  realm-id: realm1
  admin-users:
    - jack

  ecs:
    name: ${ecs_cluster_name}
    region: ${ecs_region}
    subnets:
      - ${ecs_subnet_0}
      - ${ecs_subnet_1}
    security-groups: ${ecs_security_group}

  users:
    - name: jack
      password: password
      groups: mathematicians
  specs:
    - id: 01_hello
      display-name: Hello Application
      description: Application which demonstrates the basics of a Shiny app
      container-cmd: [ "R", "-e", "shinyproxy::run_01_hello()" ]
      container-image: openanalytics/shinyproxy-demo
      access-groups: [ scientists, mathematicians ]
      # cpu and memory request are required, see: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-cpu-memory-error.html
      container-cpu-request: 1024
      container-memory-request: 2048

fqdn: ${loadbalancer_fqdn}
image: registry.openanalytics.eu/openanalytics/shinyproxy-snapshot:3.3.0-SNAPSHOT-20261013.115715
cpu-request: 512
memory-request: 1024
ecsManagedSecrets:
  - name: REDIS_PASSWORD
    # replace <secret_arn> by the secret_arn output of terraform
    valueFrom: "<secret_arn>:REDIS_PASSWORD::"
  - name: REDIS_HOST
    # replace <secret_arn> by the secret_arn output of terraform
    valueFrom: "<secret_arn>:REDIS_HOST::"
